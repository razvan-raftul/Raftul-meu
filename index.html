<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raftul Meu</title>
<meta name="description" content="Biblioteca ta de cărți, în limba română, accesibilă cu VoiceOver.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Raftul Meu">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: iOS tab-bar app — large-title navigation, inset grouped lists, bottom sheets */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#111114; --muted:#6C6C72; --line:#E1E1E7; --fill:#E9E9EF;
  --accent:#2448B8; --accent-soft:#E5EBFA; --good:#1E8E4E; --warn:#B26A00; --danger:#D23B33; --star:#E3A21A;
  --bar:rgba(249,249,251,.94); --scrim:rgba(0,0,0,.32);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000; --card:#1C1C1E; --fg:#F4F4F6; --muted:#9A9AA1; --line:#2E2E31; --fill:#2C2C2E;
  --accent:#7D9CFF; --accent-soft:#1C2441; --good:#3BC47A; --warn:#F0A43A; --danger:#FF5F57; --star:#F2B937;
  --bar:rgba(20,20,22,.94); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --card:#1C1C1E; --fg:#F4F4F6; --muted:#9A9AA1; --line:#2E2E31; --fill:#2C2C2E;
  --accent:#7D9CFF; --accent-soft:#1C2441; --good:#3BC47A; --warn:#F0A43A; --danger:#FF5F57; --star:#F2B937;
  --bar:rgba(20,20,22,.94); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.screen{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(100px + env(safe-area-inset-bottom,0px))}
.nav{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:8px}
.nav .back{background:none;border:0;color:var(--accent);font-size:17px;padding:8px 0;display:flex;align-items:center;gap:2px;cursor:pointer}
.nav .act{background:none;border:0;color:var(--accent);font-size:17px;padding:8px 0;cursor:pointer}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.round svg{width:20px;height:20px}
h1{font:700 34px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 12px;text-wrap:balance}
h2.sec{font:700 22px/1.2 var(--display);margin:26px 0 10px;letter-spacing:-.01em}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:24px 16px 7px}
.foot{font-size:13px;color:var(--muted);margin:7px 16px 0}
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 16px;background:none;border:0;text-align:left;cursor:pointer;position:relative}
.group>*+*::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--line)}
.group>*{position:relative}
.cell .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.cell .ico svg{width:18px;height:18px}
.cell .grow{flex:1;min-width:0}
.cell .val{color:var(--muted)}
.chev{color:var(--muted);flex:none}
.chev svg{width:14px;height:14px;display:block}
.search{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:10px;padding:0 10px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;font-size:17px;outline:none}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--fill);font-size:15px;cursor:pointer;white-space:nowrap}
.chip[aria-selected="true"],.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.shelf{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.shelf::-webkit-scrollbar{display:none}
.tile{flex:none;width:118px;background:none;border:0;padding:0;text-align:left;cursor:pointer;scroll-snap-align:start}
.tile .t{font-size:14px;font-weight:600;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .r{font-size:12px;color:var(--muted);margin-top:2px}
.cover{position:relative;width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--fill);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px;color:#fff;font:700 13px/1.15 var(--display)}
.cover .ph small{font:500 11px var(--font);opacity:.85}
.mini{width:46px;flex:none}
.mini .cover .ph{padding:4px;font-size:9px}
.mini .cover .ph small{display:none}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:10px 16px;background:none;border:0;text-align:left;cursor:pointer;position:relative}
.row .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .a{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--accent)}
.stars{color:var(--star);letter-spacing:.5px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.addmini{flex:none;border:0;border-radius:999px;padding:7px 12px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;cursor:pointer}
.addmini.done{background:var(--fill);color:var(--muted)}
.hero{background:linear-gradient(135deg,#2448B8,#3B6BE0);color:#fff;border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;margin-top:6px}
.hero .mini{width:62px}
.hero .t{font:700 18px/1.2 var(--display)}
.hero .s{opacity:.85;font-size:14px}
.hero .bar{background:rgba(255,255,255,.3)}.hero .bar>i{background:#fff}
.hero button.go{margin-left:auto;border:0;border-radius:999px;background:#fff;color:#2448B8;font-weight:600;padding:8px 14px;cursor:pointer;flex:none}
.empty{background:var(--card);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.btn{border:0;border-radius:12px;font-weight:600;padding:14px 16px;cursor:pointer;width:100%;font-size:17px}
.btn.primary{background:var(--accent);color:#fff}
.btn.plain{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--card);color:var(--danger)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--r);padding:14px}
.stat .n{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.months{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:12px 16px;align-items:center;position:relative}
.mrow .mn{font-weight:600}
.mrow .mv{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .mb{height:6px;border-radius:3px;background:var(--fill);margin-top:5px;overflow:hidden}
.mrow .mb>i{display:block;height:100%;background:var(--accent)}
.goalbar{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.goalbar>i{display:block;height:100%;background:var(--good)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{min-width:44px;height:44px;border-radius:10px;border:0;background:var(--accent-soft);color:var(--accent);font-size:17px;font-weight:600;cursor:pointer;padding:0 10px}
.stepper output{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--line);padding:6px 0 calc(4px + env(safe-area-inset-bottom,0px));z-index:30}
.tabs{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;cursor:pointer}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--accent)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:14px 14px 0 0;max-height:94%;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .in{max-width:680px;margin:0 auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.shead h2{font:600 17px var(--font);margin:0;flex:1;text-align:center}
.shead button{background:none;border:0;color:var(--accent);font-size:17px;padding:8px 0;min-width:70px;cursor:pointer}
.shead button.strong{font-weight:600;text-align:right}
.field{display:flex;flex-direction:column;gap:3px;padding:10px 16px;position:relative}
.field label,.field legend{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{border:0;background:transparent;padding:2px 0;font-size:17px;outline:none;width:100%}
.field textarea{min-height:90px;resize:vertical}
fieldset.field{border:0;margin:0;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg label{position:relative;text-align:center;font-size:13.5px;padding:7px 2px;border-radius:7px;cursor:pointer;color:var(--fg)}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rate{display:flex;gap:4px}
.rate label{position:relative;font-size:32px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.rate label.on{color:var(--star)}
.rate input{position:absolute;inset:0;opacity:0;margin:0}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked+span{background:var(--good)}
.toggle input:checked+span::after{transform:translateX(20px)}
.dtop{display:flex;gap:16px;align-items:flex-start;margin:8px 0 6px}
.dtop .mini{width:100px}
.dtop h3{font:700 22px/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
.desc{font-size:15px;line-height:1.45;color:var(--fg);background:var(--card);border-radius:var(--r);padding:14px 16px;white-space:pre-line}
.confirm{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;z-index:60;max-width:90%;text-align:center}
.spin{display:flex;justify-content:center;padding:24px;color:var(--muted);font-size:15px}
.hist{font-size:15px}
.hist .d{font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.toggle span,.toggle span::after{transition:none}}
</style>
</head>
<body>
<main id="app" class="screen" tabindex="-1"></main>

<nav class="tabbar" aria-label="Meniu principal">
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="home" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Acasă</button>
    <button class="tab" role="tab" data-tab="library" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3.5" width="4" height="17" rx="1"/><rect x="10" y="3.5" width="4" height="17" rx="1"/><path d="m16.2 5.2 3.6-1 3 15.8-3.6 1z"/></svg>Bibliotecă</button>
    <button class="tab" role="tab" data-tab="discover" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Descoperă</button>
    <button class="tab" role="tab" data-tab="search" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>Caută</button>
    <button class="tab" role="tab" data-tab="more" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>Mai multe</button>
  </div>
</nav>

<div id="sheets"></div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="padding:20px">Raftul Meu are nevoie de JavaScript. Deschide aplicația în Safari sau Chrome, nu în previzualizarea unui fișier.</p></noscript>
<script src="app.js"></script>
</body>
</html>
