<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistent de cadru</title>
<meta name="description" content="Te ghidează vocal să te încadrezi corect când filmezi cu telefonul.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadru">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#F2F2F7;--card:#fff;--fg:#111;--muted:#6b6b70;--accent:#2448B8;--ok:#1E8E4E;--warn:#C0392B}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f2f2f7;--muted:#a1a1a6;--accent:#6E8BFF;--ok:#30D158;--warn:#FF6961}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:8px 0 4px}
p.lead{color:var(--muted);margin:0 0 16px}
fieldset{border:0;background:var(--card);border-radius:14px;padding:6px 14px 10px;margin:0 0 14px}
legend{font-weight:600;padding:10px 0 4px;float:left;width:100%}
label.opt{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:.5px solid rgba(128,128,128,.25)}
label.opt:first-of-type{border-top:0}
label.opt input{width:22px;height:22px;accent-color:var(--accent);flex:none}
label.opt small{display:block;color:var(--muted);font-size:14px}
.btns{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:15px;background:var(--card);color:var(--accent)}
button.primary{background:var(--accent);color:#fff}
button.stop{background:var(--warn);color:#fff}
#status{background:var(--card);border-radius:14px;padding:14px;min-height:56px;font-size:18px;font-weight:600}
#status.ok{color:var(--ok)}
#details{color:var(--muted);font-size:15px;margin-top:8px;white-space:pre-line}
.stage{position:relative;margin:14px 0;border-radius:14px;overflow:hidden;background:#111;max-height:46vh;display:flex;justify-content:center}
video,canvas{max-width:100%;max-height:46vh;display:block}
canvas{position:absolute;inset:0;margin:auto}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 id="title" tabindex="-1">Asistent de cadru</h1>
  <p class="lead">Pune telefonul pe stativ, alege cum vrei să apari și apasă Pornește. Îți spun cum să muți telefonul până ești bine încadrat.</p>

  <section id="setup">
    <fieldset>
      <legend>Cum vrei să apari?</legend>
      <label class="opt"><input type="radio" name="mode" value="head" checked><span>Cap și umeri<small>Fața și umerii, cu puțin spațiu deasupra capului.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="waist"><span>Până la talie<small>Se văd și mâinile și brațele.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="full"><span>Tot corpul<small>Din cap până în picioare.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="side"><span>Din lateral<small>Stai cu profilul spre telefon, până la talie.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="hands"><span>Doar mâinile<small>De exemplu mâinile pe clape sau pe instrument, văzute de sus sau din față.</small></span></label>
    </fieldset>
    <fieldset>
      <legend>Ce cameră folosești?</legend>
      <label class="opt"><input type="radio" name="cam" value="user" checked><span>Camera din față<small>Ecranul e spre tine.</small></span></label>
      <label class="opt"><input type="radio" name="cam" value="environment"><span>Camera din spate<small>Ecranul e spre perete. Calitate mai bună.</small></span></label>
    </fieldset>
    <fieldset>
      <legend>Opțiuni</legend>
      <label class="opt"><input type="checkbox" id="optObjects" checked><span>Spune-mi ce obiecte apar în cadru</span></label>
      <label class="opt"><input type="checkbox" id="optVoice"><span>Folosește vocea aplicației<small>Altfel citește VoiceOver. Pornește-o dacă VoiceOver e închis.</small></span></label>
    </fieldset>
    <div class="btns">
      <button class="primary" id="start">Pornește</button>
    </div>
  </section>

  <section id="live" class="hidden" aria-label="Ghidare">
    <div id="status" role="status" aria-live="polite" aria-atomic="true">Pregătesc camera…</div>
    <div id="details"></div>
    <div class="btns">
      <button id="describe">Ce se vede acum?</button>
      <button id="learn">Învață studioul gol</button>
      <button id="forget" class="hidden">Uită studioul învățat</button>
      <button class="stop" id="stop">Oprește</button>
    </div>
    <div class="stage" aria-hidden="true"><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
  </section>
</main>
<div id="say" class="sr" aria-live="assertive" aria-atomic="true"></div>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
